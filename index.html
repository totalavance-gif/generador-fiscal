<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAT - Generación de Constancia</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f2f2f2; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .logo { width: 120px; margin-bottom: 1rem; }
        h1 { font-size: 1.2rem; color: #1d1d1b; margin-bottom: 1.5rem; border-bottom: 2px solid #bc955c; padding-bottom: 0.5rem; }
        input { width: 100%; padding: 10px; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; text-transform: uppercase; }
        button { width: 100%; background-color: #bc955c; color: white; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #98774a; }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://www.gob.mx/cms/uploads/action_program/main_image/26942/post_SAT.jpg" class="logo" alt="SAT Logo">
        <h1>Generar Constancia</h1>
        <input type="text" id="curp" placeholder="INGRESA TU CURP" maxlength="18">
        <button onclick="generar()">GENERAR PDF</button>
    </div>

    <script>
        function generar() {
            const curp = document.getElementById('curp').value.trim().toUpperCase();
            if(curp.length === 18) {
                window.location.href = `/api/generar?curp=${curp}`;
            } else {
                alert("Por favor, ingresa un CURP válido de 18 caracteres.");
            }
        }
    </script>
</body>
</html>
